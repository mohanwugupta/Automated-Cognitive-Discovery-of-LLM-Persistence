[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cognitive-discovery"
version = "0.1.0"
description = "Coverage-oriented behavioral discovery of LLM persistence computations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scipy>=1.10",
  # Frozen behavioral RidgeCV packages were serialized with this version.
  "scikit-learn==1.9.0",
  "torch>=2.1",
  "matplotlib>=3.8",
  "safetensors>=0.4",
]

[project.optional-dependencies]
qwen = ["transformers>=5.12", "accelerate>=1.2", "huggingface-hub>=0.34"]
parquet = ["pyarrow>=14"]
design = ["sweetpea>=0.2"]
dev = ["pytest>=8", "pytest-cov", "ruff", "black"]

[project.scripts]
cognitive-discovery-design = "cognitive_discovery.cli:generate_design_main"
cognitive-discovery-run = "cognitive_discovery.cli:run_experiments_main"
cognitive-discovery-fit = "cognitive_discovery.cli:fit_models_main"
cognitive-discovery-residuals = "cognitive_discovery.cli:discover_residuals_main"
cognitive-discovery-validate = "cognitive_discovery.cli:validate_predictions_main"
cognitive-discovery-active = "cognitive_discovery.cli:active_discovery_main"
cognitive-discovery-theory = "cognitive_discovery.cli:theory_resolution_main"
cognitive-discovery-mechanistic = "cognitive_discovery.cli:mechanistic_main"
cognitive-discovery-action-history = "cognitive_discovery.cli:action_history_main"
cognitive-discovery-causal-mech = "cognitive_discovery.cli:causal_mechanistic_main"
cognitive-discovery-specificity = "cognitive_discovery.cli:causal_specificity_main"
cognitive-discovery-abstraction = "cognitive_discovery.cli:causal_abstraction_main"
cognitive-discovery-ood = "cognitive_discovery.cli:ood_generation_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
