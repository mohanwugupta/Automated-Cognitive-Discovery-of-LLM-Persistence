endpoint_definitions:
  persistence_logit:
    definition: "log p(continue) - log p(disengage) after renormalization over the two response tokens"
  cognitive_counterfactual_recovery:
    definition: "Recovery of the frozen behavioral model's predicted source-minus-base effect."
    canonical_metric: "global_cfr_v1"
  natural_effect_recovery:
    definition: "Recovery of the unmodified language model's empirical source-minus-base effect."
    canonical_metric: "global_cfr_v1"
    separation_rule: "Must never be reported as cognitive-counterfactual recovery."
  global_cfr_v1:
    formula: "1 - sum((observed_effect - target_effect)^2) / sum((baseline_effect - target_effect)^2)"
    baseline_effect: 0.0
    supersedes: "mean of per-example CFR values"

