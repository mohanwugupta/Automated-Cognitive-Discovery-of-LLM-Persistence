protocol_version: active_hierarchical_discovery_v2
model: Qwen/Qwen3.5-4B
model_revision: null
base_seed: 280226
design_seed: 280227
split_seed: 280228
response_labels: [X, Y]
output_root: artifacts/discovery_v2

# Round 2 uses the same legal ontology as Round 1. Task descriptors below are
# structural metadata and are frozen in hierarchy/task_descriptors.py.
design:
  backend: native
  discovery_conditions: 2800
  pilot_conditions_per_task: 70
  validation_conditions: 700
  task_families:
    - bandit
    - foraging
    - solvability
    - information_sampling
    - waiting
    - effort
    - debugging
  core_crossing:
    - task_family
    - response_mapping
    - continuation_advantage
    - history_valence
  factor_levels:
    continuation_value: [low, medium, high]
    disengagement_value: [low, medium, high]
    continuation_cost: [low, medium, high]
    progress_evidence: [negative, neutral, positive]
    success_evidence: [low, medium, high]
    uncertainty: [low, high]
    prior_investment: [low, high]
    controllability: [low, high]
    environmental_stability: [stable, changing]
    goal_continuity: [same, new]
  history_lengths: [0, 1, 3, 5]
  history_valences: [negative, neutral, mixed, positive]

splits:
  discovery: 0.60
  interpolation_test: 0.20
  structural_test: 0.20
  structural_holdout:
    - [continuation_value, high, continuation_cost, high]
    - [progress_evidence, negative, uncertainty, high]

collection:
  sample_actions: true
  expand_history_prefixes: true
  save_prompts_separately: true
  shard_count: 8
  batch_size: 1
  pilot_probability_bounds: [0.05, 0.95]
  minimum_logit_sd: 0.15
  minimum_parse_rate: 0.99
  minimum_top_token_action_rate: 0.90
  maximum_mapping_gap: 0.25

models:
  sharing: [task_specific, fully_shared, hierarchical]
  ridge_penalties: [0.001, 0.01, 0.1, 1.0, 10.0]
  cognitive:
    - intercept
    - immediate_state
    - dynamic_reevaluation
    - choice_perseveration
    - outcome_history
    - dual_history
    - latent_motivation
    - latent_context
    - option_termination
    - meta_control
    - task_set_reinstatement
    - generic_sequential_choice
  flexible: [linear_interactions, gam, mlp, gru]
  flexible_sharing: [fully_shared, task_specific, hierarchical, task_embedding]
  flexible_validation_minimum_r2: 0.90
  round2_teacher_minimum_r2: 0.98
  mlp:
    hidden_size: 64
    learning_rate: 0.001
    max_epochs: 200
    patience: 20
  gru:
    hidden_size: 64
    learning_rate: 0.001
    max_epochs: 200
    patience: 20

hierarchy:
  architectures:
    - immediate_state
    - choice_perseveration
    - outcome_history
    - dual_history
    - dynamic_reevaluation
    - latent_context
    - latent_motivation
  variants: [M1, M2, M3, M4]
  ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0]
  descriptor_count: 6
  few_shot_architectures: [dual_history, latent_context]
  few_shot_conditions: [0, 1, 4, 8, 16, 32, 64]
  bootstraps: 500
  parameter_bootstraps: 100

active_sampling:
  budget: 1400
  smoke_budget: 70
  candidate_multiplier: 10
  candidate_seed: 2028227
  information_architecture: dual_history
  information_bootstraps: 32
  architecture_a: dual_history
  architecture_b: latent_context
  mixture:
    coverage: 0.40
    information: 0.40
    disagreement: 0.20
  efficiency_budgets: [100, 250, 500, 1000]

residual_discovery:
  minimum_task_families: 2
  bootstraps: 200
  stability_threshold: 0.60
  support_threshold: 0.95

final_validation:
  conditions: 700
  smoke_conditions: 70
  refit: false

validation:
  conditions: 700
  refit: false

cluster:
  conda_env: llm-cognitive-discovery
  model_path_template: /scratch/gpfs/JORDANAT/{user}/models/Qwen--Qwen3.5-4B
  scratch_template: /scratch/gpfs/JORDANAT/{user}/llm-cognitive-discovery
  gpu_constraint: gpu40
